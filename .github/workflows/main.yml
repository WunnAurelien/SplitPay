name: Déploiement GitHub Pages

on:
  # Déclenche le workflow à chaque push sur la branche main (ou master)
  push:
    branches:
      - main 

# Permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'annuler les déploiements en cours si un nouveau push arrive
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Configuration de Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build de l'application
        run: npm run build

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload de l'artefact (dossier dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v5
